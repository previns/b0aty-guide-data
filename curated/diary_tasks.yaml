# Guide step -> the achievement-diary bit the game sets when it is done.
#
# HUMAN-EDITED. Scripts read this and never write to it.
#
# Keyed by step id, so rewording a step on the wiki drops its row rather than
# silently re-pointing it at the wrong task. merge_curated warns about a key
# that no longer matches a step.
#
# The signal is exact: the game sets a bit in a VarPlayer and the client reads
# it. What needs a person is which task a step means. The guide says "Check
# playtime on Hans"; Quest Helper's panel says "Learn Age from Hans". Only
# prose connects those, and string similarity is actively misleading here --
# it ranked "Travel to Entrana" against "Fill Water Bucket" (0.49) above the
# correct "To the Holy Land!", and put "Sarah's Farming Shop" top for the
# Falador wall shortcut.
#
# Every row below was decided by reading the tier's FULL task list, not the
# ranking.
#
# Where Quest Helper's titles are jokes -- Falador's medium tier is all
# puns -- read the wiki's task table instead. Quest Helper's bit order matches
# the wiki's task order exactly, which decodes them: "Yoink!" is the telegrab,
# not the pickpocket, and "Initialising..." is praying in full Initiate. Two
# rows were wrong for exactly that reason before this was noticed. Review with:
#
#   python pipeline/build_diary_candidates.py
#   python pipeline/merge_curated.py --check-diary
#
# A wrong row here is the worst failure the plugin has: it marks work done
# that the player never did, and they find out much later, having skipped it.
# When unsure, leave the step out -- a manual checkbox is a fine outcome.

