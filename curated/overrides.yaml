  # "Head North of Falador and kill a Black Bear". Black bears have no map
  # coordinates on the wiki, so the only one available came from quest-helper,
  # joined on the npc id -- and the quest that uses that id fights the Varrock
  # bear, 357 tiles from where this step sends you. The waypoint pointed
  # players across the map.
  #
  # The id stays, so the bear is still outlined the moment one loads. Only the
  # coordinate goes: no source here knows which spawn the guide means, and
  # typing one in from memory is the thing this pipeline exists not to do.
  #
  # This is a hand-written fix and not a rule, deliberately. 77 targets take
  # their only coordinate from quest-helper, and the measurement is in
  # docs/quest-helper-points.md: no distance test separates the wrong ones from
  # the right ones without also throwing away Mudskipper Point and Shilo
  # Village, which are far from the town the step names and are correct.
  260e82444c:
    target:
      name: "Black Bear"
      kind: npc
      ids: [2839]
      points: []
      confidence: manual

  # Travel lines that named a place the build could not place, 2026-09-08.
  #
  # The author reported "Head to Tree Gnome Village" pointing at the Hazeel Cult
  # area instead. The cause is plain once measured: its target carries no ids and
  # no points, and neither does its destination, so the plugin is handed a step
  # with nothing to aim at. 265 steps are in that state, 52 of them "nav".
  #
  # The tempting rule -- borrow the coordinate of the quest the step names -- was
  # measured and rejected. It is wrong far more often than it is right: it would
  # send "Kill a giant rat" to Taverley, "Enter Varrock Sewer" to Varrock Square,
  # and "Collect a Kebab & Egg" to Lletya. Narrowing it to nav targets whose name
  # matches their own quest leaves five candidates, and even one of those is
  # wrong: Black Knights' Fortress would point at Falador Castle, roughly 200
  # tiles away, which is the same defect the author is reporting. It is therefore
  # deliberately absent below.
  #
  # So these four are hand-verified against the quest helper's own first step,
  # one at a time, and written down rather than derived. Same reasoning as the
  # Black Bear entry above and docs/quest-helper-points.md.

  # "Speak to King Bolren in the centre of the Tree Gnome Maze." That is the
  # village the step is telling the player to travel to.
  ab850a390d:
    target:
      name: "Tree Gnome Village"
      kind: nav
      ids: []
      points: [[2541, 3170, 0]]
      confidence: manual

  # "Talk to Councillor Halgrive outside the East Ardougne church." The step says
  # head north to the church and start the quest; this is that church.
  7b84101455:
    target:
      name: "East Ardougne church"
      kind: nav
      ids: []
      points: [[2615, 3298, 0]]
      confidence: manual

  # "Go to the top floor of the Watchtower north of Yanille." The trellis base is
